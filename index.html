<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0d16" />
  <title>Nox Loader</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%237b6cff'/%3E%3Ctext x='32' y='44' font-family='Verdana,sans-serif' font-size='34' font-weight='700' fill='%23fff' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E" />
</head>
<body>

  <!-- ================= TOP BAR ================= -->
  <header class="nav">
    <button class="brand" id="brandHome" aria-label="home">
      <span class="brand__mark">N</span>
      <span class="brand__name">Nox&nbsp;Loader</span>
    </button>

    <div class="search">
      <svg viewBox="0 0 24 24" class="search__icon" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
      <input id="search" type="text" placeholder="search" spellcheck="false" autocomplete="off" />
    </div>

    <div class="nav__meta"><span id="navCount"></span></div>
  </header>

  <!-- ================= LIBRARY VIEW ================= -->
  <main class="wrap" id="libraryView">
    <section class="hero" aria-label="featured">
      <div class="hero__track" id="heroTrack"></div>
      <button class="hero__arrow hero__arrow--prev" id="heroPrev" aria-label="previous">‹</button>
      <button class="hero__arrow hero__arrow--next" id="heroNext" aria-label="next">›</button>
      <div class="hero__dots" id="heroDots"></div>
    </section>

    <section class="floor" aria-label="all">
      <div class="grid" id="grid"></div>
      <p class="empty" id="empty" hidden>no matches</p>
    </section>
  </main>

  <!-- ================= HTML VIEW ================= -->
  <section class="byo" id="htmlView" hidden>
    <div class="byo__inner">
      <div class="drop" id="drop" role="button" tabindex="0">
        <span class="drop__icon">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4m0 0l-5 5m5-5l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </span>
        <span class="drop__title">drop a file or click to pick</span>
        <span class="drop__hint">.html or .svg</span>
      </div>
      <input id="fileInput" type="file" accept=".html,.htm,.svg,image/svg+xml,text/html" hidden />

      <div class="byo__or"><span>or</span></div>

      <div class="ghrow">
        <input id="ghInput" class="ghrow__input" type="text" spellcheck="false" autocomplete="off" placeholder="paste a link or github repo" />
        <button id="ghBtn" class="ghrow__btn">Load</button>
      </div>

      <div class="loadingfile" id="loadingFile" hidden><span class="pulse"></span> loading file</div>
    </div>
  </section>

  <!-- ================= FLOATING ISLAND ================= -->
  <nav class="island" aria-label="sections">
    <span class="island__pill" id="islandPill" aria-hidden="true"></span>
    <button class="island__tab is-active" data-view="library">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
      <span>Library</span>
    </button>
    <button class="island__tab" data-view="html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8l-4 4 4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 8l4 4-4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>HTML</span>
    </button>
  </nav>

  <!-- ================= IN-PAGE VIEWER (for imports) ================= -->
  <div class="viewer" id="viewer" hidden>
    <div class="viewer__bar">
      <button class="viewer__back" id="vBack">‹ back</button>
      <div class="viewer__id"><span id="vTitle">loading</span></div>
      <div class="viewer__actions">
        <button id="vReload" title="reload">reload</button>
        <button id="vNew" title="open in a new tab">open</button>
      </div>
    </div>
    <div class="viewer__stage">
      <div class="viewer__loading" id="vLoading"><span class="pulse"></span> opening</div>
      <iframe id="frame" class="viewer__frame" title="loaded content"
        allow="accelerometer; autoplay; camera; clipboard-write; encrypted-media; fullscreen; gamepad; gyroscope; microphone; midi; xr-spatial-tracking"
        allowfullscreen></iframe>
    </div>
  </div>

  <!-- ================= HIDDEN SCRATCH EDITOR ================= -->
  <div class="editor" id="editor" hidden>
    <div class="editor__bar">
      <div class="editor__id"><span class="editor__dot"></span> scratch</div>
      <div class="editor__actions">
        <button id="edRun">run</button>
        <button id="edWrap">wrap</button>
        <button id="edFull">open</button>
        <button id="edClose">close</button>
      </div>
    </div>
    <div class="editor__body">
      <textarea id="edCode" class="editor__code" spellcheck="false" placeholder="write html here"></textarea>
      <div class="editor__preview"><iframe id="edPreview" title="scratch preview"></iframe></div>
    </div>
  </div>

  <button class="spark" id="editorTrigger" title=" " aria-label="scratch"></button>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
