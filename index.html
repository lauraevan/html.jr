<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="HTML JR. Pick a loader and it opens. T9OS, gn-math, Cherri and more, or paste any link." />
  <meta name="theme-color" content="#12131a" />
  <title>HTML JR</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%237b6cff'/%3E%3Ctext x='32' y='43' font-family='Verdana,sans-serif' font-size='30' font-weight='700' fill='%23fff' text-anchor='middle'%3EJR%3C/text%3E%3C/svg%3E" />
</head>
<body>

  <div class="ambient" aria-hidden="true"><span></span><span></span><span></span></div>

  <!-- ================= TOP BAR ================= -->
  <header class="nav">
    <button class="brand" id="brandHome" aria-label="home">
      <span class="brand__mark">JR</span>
      <span class="brand__name">HTML&nbsp;JR</span>
    </button>

    <div class="search">
      <svg viewBox="0 0 24 24" class="search__icon" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
      <input id="search" type="text" placeholder="search loaders" spellcheck="false" autocomplete="off" />
    </div>

    <div class="nav__meta"><span id="navCount">0 loaders</span></div>
  </header>

  <main class="wrap">

    <!-- ================= HERO ================= -->
    <section class="hero" aria-label="featured">
      <div class="hero__track" id="heroTrack"></div>
      <button class="hero__arrow hero__arrow--prev" id="heroPrev" aria-label="previous">‹</button>
      <button class="hero__arrow hero__arrow--next" id="heroNext" aria-label="next">›</button>
      <div class="hero__dots" id="heroDots"></div>
    </section>

    <!-- ================= MANUAL LOAD ================= -->
    <section class="paste">
      <input id="manual" class="paste__input" type="text" spellcheck="false" autocomplete="off"
             placeholder="paste any link and hit load" />
      <button id="manualBtn" class="paste__btn">Load</button>
    </section>

    <!-- ================= GRID ================= -->
    <section class="floor" aria-label="all loaders">
      <div class="floor__head">
        <h2 class="floor__title">All loaders</h2>
      </div>
      <div class="grid" id="grid"></div>
      <p class="empty" id="empty" hidden>nothing matches that search.</p>
    </section>
  </main>

  <footer class="foot">
    <span class="foot__name">HTML JR</span>
    <span class="foot__mid">made for messing around</span>
    <button class="foot__spark" id="editorTrigger" title=" " aria-label="scratch">·</button>
  </footer>

  <!-- ================= VIEWER ================= -->
  <div class="viewer" id="viewer" hidden>
    <div class="viewer__bar">
      <button class="viewer__back" id="vBack">‹ back</button>
      <div class="viewer__id"><span id="vTitle">loading</span><span class="viewer__ver" id="vVer"></span></div>
      <div class="viewer__actions">
        <button id="vReload" title="reload">reload</button>
        <button id="vNew" title="open in a new tab">open</button>
        <button id="vFull" title="fullscreen">full</button>
      </div>
    </div>
    <div class="viewer__stage">
      <div class="viewer__loading" id="vLoading"><span class="pulse"></span> opening</div>
      <iframe id="frame" class="viewer__frame" title="loaded content"
        allow="accelerometer; autoplay; camera; clipboard-write; encrypted-media; fullscreen; gamepad; gyroscope; microphone; midi; xr-spatial-tracking"
        allowfullscreen></iframe>
    </div>
  </div>

  <!-- ================= HIDDEN SCRATCH EDITOR ================= -->
  <div class="editor" id="editor" hidden>
    <div class="editor__bar">
      <div class="editor__id"><span class="editor__dot"></span> scratch</div>
      <div class="editor__actions">
        <button id="edRun" title="refresh the preview">run</button>
        <button id="edWrap" title="soft wrap">wrap</button>
        <button id="edFull" title="open it in the big viewer">open full</button>
        <button id="edClose" title="close (esc)">close</button>
      </div>
    </div>
    <div class="editor__body">
      <textarea id="edCode" class="editor__code" spellcheck="false" placeholder="write html here, it renders on the right"></textarea>
      <div class="editor__preview"><iframe id="edPreview" title="scratch preview"></iframe></div>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
