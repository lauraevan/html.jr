<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Classroom</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#111;
    color:#fff;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.searchBar{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.searchBar input{
    flex:1;
    padding:12px;
    font-size:16px;
    border:none;
    border-radius:8px;
}

.searchBar button{
    padding:12px 20px;
    background:#ff0000;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

.searchBar button:hover{
    background:#d40000;
}

#playerContainer{
    display:none;
    margin-bottom:25px;
    position:relative;
}

#player{
    width:100%;
    aspect-ratio:16/9;
    border:none;
    border-radius:10px;
    background:#000;
}

#closePlayer{
    position:absolute;
    top:10px;
    right:10px;
    width:40px;
    height:40px;
    border:none;
    border-radius:50%;
    background:red;
    color:white;
    font-size:22px;
    cursor:pointer;
    z-index:10;
}

#results{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:20px;
}

.video{
    background:#222;
    border-radius:10px;
    overflow:hidden;
    cursor:pointer;
    transition:.2s;
}

.video:hover{
    transform:scale(1.03);
}

.video img{
    width:100%;
    display:block;
}

.video h3{
    margin:10px;
    font-size:16px;
    line-height:1.3;
}

.video p{
    margin:10px;
    color:#aaa;
}
</style>
</head>
<body>

<div class="container">

<h1></h1>

<div class="searchBar">
<input id="searchBox" placeholder="Search YouTube videos...">
<button onclick="searchVideos()">Search</button>
</div>

<div id="playerContainer">
<button id="closePlayer" onclick="closePlayer()">✕</button>

<iframe
    id="player"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
    allowfullscreen>
</iframe>

</div>

<div id="results"></div>

</div>

<script>

const API_KEY = "AIzaSyBHGgpOQrh-m0s-FA_dFMTfLoY_HXI8g58";

async function searchVideos(){

    const query = document.getElementById("searchBox").value.trim();

    if(!query) return;

    const url =
`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=20&q=${encodeURIComponent(query)}&key=${API_KEY}`;

    try{

        const response = await fetch(url);
        const data = await response.json();

        if(data.error){
            alert(data.error.message);
            return;
        }

        const results = document.getElementById("results");
        results.innerHTML = "";

        data.items.forEach(item=>{

            const videoId = item.id.videoId;

            const card = document.createElement("div");
            card.className = "video";

            card.innerHTML = `
                <img src="${item.snippet.thumbnails.high.url}">
                <h3>${item.snippet.title}</h3>
                <p>${item.snippet.channelTitle}</p>
            `;

            card.onclick = () => playVideo(videoId);

            results.appendChild(card);

        });

    }
    catch(err){
        console.error(err);
        alert("Search failed.");
    }

}

function playVideo(videoId){

    const iframe = document.getElementById("player");

    iframe.src =
`https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&rel=0`;

    document.getElementById("playerContainer").style.display = "block";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

function closePlayer(){

    document.getElementById("player").src = "";

    document.getElementById("playerContainer").style.display = "none";

}

document.getElementById("searchBox").addEventListener("keydown",function(e){

    if(e.key==="Enter"){
        searchVideos();
    }

});

</script>

</body>
</html>
