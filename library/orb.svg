<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eafff3"/>
      <stop offset="35%" stop-color="#3dfc7f"/>
      <stop offset="75%" stop-color="#0e7a3a"/>
      <stop offset="100%" stop-color="#02120a"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3dfc7f" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3dfc7f" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="400" height="400" fill="#04070c"/>

  <!-- pulsing halo -->
  <circle cx="200" cy="200" r="150" fill="url(#halo)">
    <animate attributeName="r" values="140;168;140" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- orbit rings -->
  <g fill="none" stroke="#3dfc7f" stroke-width="1.4" filter="url(#glow)">
    <ellipse cx="200" cy="200" rx="150" ry="52" stroke-opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="9s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="200" cy="200" rx="150" ry="52" stroke-opacity="0.5">
      <animateTransform attributeName="transform" type="rotate" from="60 200 200" to="420 200 200" dur="7s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="200" cy="200" rx="150" ry="52" stroke-opacity="0.35">
      <animateTransform attributeName="transform" type="rotate" from="120 200 200" to="480 200 200" dur="12s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- travelling nodes -->
  <g fill="#eafff3" filter="url(#glow)">
    <circle r="4"><animateMotion dur="9s" repeatCount="indefinite" path="M50,200 a150,52 0 1,0 300,0 a150,52 0 1,0 -300,0"/></circle>
    <circle r="3" fill="#35e5e5"><animateMotion dur="7s" repeatCount="indefinite" path="M50,200 a150,52 0 1,1 300,0 a150,52 0 1,1 -300,0"/></circle>
  </g>

  <!-- reactor core -->
  <circle cx="200" cy="200" r="60" fill="url(#core)" filter="url(#glow)">
    <animate attributeName="r" values="56;64;56" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- readout -->
  <text x="200" y="360" text-anchor="middle" fill="#3dfc7f" font-family="monospace" font-size="13" letter-spacing="4" opacity="0.8">
    REACTOR ORB // smith
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.4s" repeatCount="indefinite"/>
  </text>
</svg>
